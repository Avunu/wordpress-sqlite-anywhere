name: Actions lock

# Fails when an action reference is missing from the lockfile (.github/workflows/actions.lock)
# or no longer matches what its tag resolves to. It is its own workflow, not a job in the
# others, so a failure here cannot block a release gate that calls them.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension list | grep -q gh-actions-lock || gh extension install github/gh-actions-lock --pin v0.5.1

      - name: Verify the lockfile
        run: gh actions-lock --verify
