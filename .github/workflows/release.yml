name: Release

# Release Please maintains a release PR from Conventional Commits on main. Merging it
# tags v{version}; this workflow then builds the plugin zip with Nix and attaches it
# to the GitHub Release, which is what plugin-update-checker serves to sites.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false

      - name: Build plugin zip
        run: nix build .#zip -L

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release.outputs.tag_name }}" \
            result/wordpress-sqlite-anywhere.zip --clobber

  notify-failure:
    needs: [release, publish]
    if: ${{ always() && needs.release.outputs.release_created && needs.publish.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG has no zip asset" \
            --body "The release \`$TAG\` was tagged and published, but the zip build failed, so no \`wordpress-sqlite-anywhere.zip\` was attached.

          Sites using plugin-update-checker will not be able to update until an asset exists.

          Fix the failure, then re-run [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
