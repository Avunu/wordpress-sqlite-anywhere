version: 2

# Keeps every ecosystem in this repo up to date. Updates land on `main` automatically
# (see .github/workflows/dependabot-auto-merge.yml); release-please remains the gate for
# actually cutting a release. Dep bumps use the `chore` type so they never force a
# release on their own — they ride along with the next real release.
#
# The upstream driver submodule is NOT managed here: Dependabot's gitsubmodule
# ecosystem follows branch HEAD, and we pin release tags (upstream-bump.yml).
updates:
  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]

  # PHP plugin dependencies (composer.json / composer.lock).
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    groups:
      composer:
        patterns: ["*"]

  # The bundled driver's test tooling (PHPUnit 9 + WPCS). Upstream's suites use
  # PHPUnit 8/9 APIs (@dataProvider annotations, getName()), and WordPress
  # Coding Standards needs PHP_CodeSniffer 3.x: neither may move a major.
  - package-ecosystem: composer
    directory: /driver-tests/tools-project
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      driver-tools:
        patterns: ["*"]
    ignore:
      - dependency-name: phpunit/phpunit
        update-types: ["version-update:semver-major"]
      - dependency-name: squizlabs/php_codesniffer
        update-types: ["version-update:semver-major"]

  # The Rust crates.
  - package-ecosystem: cargo
    directory: /packages/turso-snapshot-publisher
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      publisher:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /packages/php-ext-wp-d1-client
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      d1-client:
        patterns: ["*"]

  # The D1 proxy worker. Its vitest config predates the Vite-plugin form that
  # @cloudflare/vitest-pool-workers 0.20+ (Vitest 4) requires; until it is
  # migrated, majors of the test stack stay put.
  - package-ecosystem: npm
    directory: /packages/d1-proxy-worker
    schedule:
      interval: daily
    commit-message:
      prefix: chore
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@cloudflare/vitest-pool-workers"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # flake.lock inputs.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      nix:
        patterns: ["*"]
