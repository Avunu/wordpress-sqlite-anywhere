[package]
name = "wp_turso"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Native pieces of the Turso backend for the MySQL-on-SQLite driver: a pooled HTTP client and an in-process embedded replica"

[lib]
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = { version = "0.15.12", default-features = false, features = ["runtime"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2", "gzip"] }
turso = { version = "0.8.0-pre.10", default-features = false, features = ["sync"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time", "sync"] }
# reqwest and turso's sync engine both link rustls; with two crypto backends in
# the tree rustls refuses to pick one at runtime, so one is installed explicitly.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
lto = "thin"
codegen-units = 1
